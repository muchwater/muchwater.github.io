<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EBS SW 2026 &middot; Junhyeong Jeon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f5f0; --surface: #ffffff; --ink: #1a1814; --ink-mid: #4a4640;
      --ink-light: #8a8480; --accent: #2a5c8f; --accent-light: #e8f0f8;
      --border: #e2ddd8;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', 'Noto Sans KR', system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(247,245,240,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 5vw; height: 52px; display: flex; align-items: center; justify-content: space-between; }
    .nav-name { font-family: var(--serif); font-size: 1.05rem; color: var(--ink); text-decoration: none; }
    .nav-back { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mid); text-decoration: none; }
    .nav-back:hover { color: var(--accent); }

    main { max-width: 760px; margin: 0 auto; padding: 110px 24px 40px; }

    .hero-eyebrow { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .hero-title { font-family: var(--serif); font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 12px; }
    .hero-desc { font-size: 0.95rem; font-weight: 300; color: var(--ink-mid); max-width: 600px; margin-bottom: 8px; }
    .hero-note { font-size: 0.82rem; color: var(--ink-light); }

    .section-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-light); margin: 56px 0 8px; }
    .section-title { font-family: var(--serif); font-size: 1.7rem; letter-spacing: -0.02em; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 22px; margin-bottom: 16px; transition: border-color 0.2s; }
    .card:hover { border-color: #b8cee0; }
    .card.common { border-left: 3px solid var(--accent); }
    .card-title { font-weight: 700; font-size: 1rem; margin-bottom: 12px; }

    table.sessions { width: 100%; border-collapse: collapse; }
    table.sessions th { text-align: left; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-light); padding: 4px 10px 8px 0; border-bottom: 1px solid var(--border); }
    table.sessions td { font-size: 0.88rem; color: var(--ink-mid); padding: 9px 10px 9px 0; border-bottom: 1px solid #f0ece6; vertical-align: middle; }
    table.sessions tr:last-child td { border-bottom: none; }
    .session-no { font-weight: 600; color: var(--ink); white-space: nowrap; }
    .tbd { color: var(--ink-light); font-style: italic; font-size: 0.82rem; }
    a.join-btn { display: inline-block; padding: 4px 14px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; background: var(--accent); color: #fff; text-decoration: none; white-space: nowrap; transition: background 0.2s; }
    a.join-btn:hover { background: #1e4a75; }

    footer { text-align: center; padding: 48px 24px; font-size: 0.78rem; color: var(--ink-light); border-top: 1px solid var(--border); margin-top: 60px; }
    @media (max-width: 520px) {
      table.sessions th:nth-child(2), table.sessions td:nth-child(2) { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-name">Junhyeong Jeon</a>
    <a href="../index.html#lectures" class="nav-back">&larr; All Lectures</a>
  </nav>

  <main>
    <section>
      <p class="hero-eyebrow">Lecture &middot; 2026</p>
      <h1 class="hero-title">EBS SW 2026</h1>
      <p class="hero-desc">EBS SW 2026 멘토링 페이지입니다. 통합 세션 및 팀별 멘토링 일정과 화상 회의 링크를 확인하세요.</p>
      <p class="hero-note">각 회차의 링크는 일정 확정 후 업데이트됩니다.</p>
    </section>

    <p class="section-label">Common Sessions</p>
    <h2 class="section-title">통합 세션</h2>
    <div id="common-sessions"></div>

    <p class="section-label">Team Mentoring</p>
    <h2 class="section-title">팀별 멘토링</h2>
    <div id="team-sessions"></div>
  </main>

  <footer>
    <p>&copy; 2026 Junhyeong (Walter) Jeon &middot; walter.j.jeon@gmail.com</p>
  </footer>

  <script>
    // ===================== 일정 데이터 =====================
    // 날짜/시간/링크가 정해지면 아래 값만 수정하세요.
    // datetime: 표시될 날짜·시간 문자열 (예: "2026-07-01 (수) 19:00")
    // link:     화상 회의 링크 (예: "https://zoom.us/j/...") — 비워두면 "미정"으로 표시
    const commonSessions = [
      { name: "OT (오리엔테이션)", datetime: "", link: "" },
    ];

    const teams = [
      { name: "시너지", sessions: [
        { no: "1회차", datetime: "", link: "" },
        { no: "2회차", datetime: "", link: "" },
      ]},
      { name: "새결", sessions: [
        { no: "1회차", datetime: "", link: "" },
        { no: "2회차", datetime: "", link: "" },
      ]},
      { name: "츄르라는단어에각성한고양이의동공", sessions: [
        { no: "1회차", datetime: "", link: "" },
        { no: "2회차", datetime: "", link: "" },
      ]},
      { name: "불꽃카리스마 민호", sessions: [
        { no: "1회차", datetime: "", link: "" },
        { no: "2회차", datetime: "", link: "" },
      ]},
      { name: "쎄리고", sessions: [
        { no: "1회차", datetime: "", link: "" },
        { no: "2회차", datetime: "", link: "" },
      ]},
      { name: "임possible", sessions: [
        { no: "1회차", datetime: "", link: "" },
        { no: "2회차", datetime: "", link: "" },
      ]},
      { name: "LCD", sessions: [
        { no: "1회차", datetime: "", link: "" },
        { no: "2회차", datetime: "", link: "" },
      ]},
    ];
    // =======================================================

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function sessionRows(sessions, labelKey) {
      return sessions.map(s => `
        <tr>
          <td class="session-no">${esc(s[labelKey])}</td>
          <td>${s.datetime ? esc(s.datetime) : '<span class="tbd">일정 미정</span>'}</td>
          <td style="text-align:right;">${s.link
            ? `<a class="join-btn" href="${esc(s.link)}" target="_blank" rel="noopener">회의 참여</a>`
            : '<span class="tbd">링크 미정</span>'}</td>
        </tr>`).join("");
    }
    function tableHTML(sessions, labelKey, labelHead) {
      return `
        <table class="sessions">
          <thead><tr><th>${labelHead}</th><th>날짜 / 시간</th><th style="text-align:right;">화상 회의</th></tr></thead>
          <tbody>${sessionRows(sessions, labelKey)}</tbody>
        </table>`;
    }

    document.getElementById("common-sessions").innerHTML =
      `<div class="card common">${tableHTML(commonSessions, "name", "세션")}</div>`;

    document.getElementById("team-sessions").innerHTML = teams.map(t => `
      <div class="card">
        <div class="card-title">${esc(t.name)}</div>
        ${tableHTML(t.sessions, "no", "회차")}
      </div>`).join("");
  </script>

</body>
</html>
